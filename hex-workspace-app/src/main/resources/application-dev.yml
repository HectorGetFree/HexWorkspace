server:
  port: 8098
  tomcat:
    mbeanregistry:
      enabled: true
    max-connections: 200
    threads:
      max: 150        # 设定处理客户请求的线程的最大数目，决定了服务器可以同时响应客户请求的数,默认200
      min-spare: 50   # 初始化线程数,最小空闲线程数,默认是10
    accept-count: 10  # 等待队列长度

# 应用配置
app:
  config:
    # 版本，方便通过接口版本升级
    api-version: v1
    # 跨域，开发阶段可以设置为 * 不限制
    cross-origin: '*'

hexworkspace:
  jwt:
    access-expire-minutes: 120
  hexgent:
    runtime-url: ${HEXGENT_RUNTIME_URL:http://127.0.0.1:8000}
    integration-token: ${HEXGENT_WORKSPACE_INTEGRATION_TOKEN:}
    command-timeout-ms: ${HEXGENT_COMMAND_TIMEOUT_MS:5000}
    lifecycle-callback-token: ${HEXGENT_WORKSPACE_LIFECYCLE_TOKEN:}
  knowledge:
    legacy-api:
      # 旧知识接口不校验文档版本与文件夹权限，Phase 1 默认关闭。
      enabled: ${HEX_WORKSPACE_LEGACY_KNOWLEDGE_API_ENABLED:false}
    embedding:
      provider: DashScope
      distance: COSINE
      collection: hex_workspace_rag_v1
      batch-size: 16
      timeout-ms: 10000
      retry-count: 2
    worker:
      lease-seconds: 120
      max-retry-count: 3
      retry-delay-seconds: 60
    dispatcher:
      fixed-delay-ms: 5000
    generation-cleanup:
      retention-hours: 168
      batch-size: 20
      lease-minutes: 10
      fixed-delay-ms: 3600000
  document-upload:
    max-retry-count: 3
    staging-orphan-retention-hours: 24
    staging-cleanup-fixed-delay-ms: 3600000
  mq:
    document-upload:
      exchange: hex.workspace.document.exchange
      queue: hex.workspace.document.upload.queue
      routing-key: document.upload.requested
      outbox-publish-lease-seconds: 30
    knowledge-index:
      exchange: hex.workspace.knowledge.exchange
      queue: hex.workspace.knowledge.index.queue
      routing-key: knowledge.index.requested
      outbox-publish-lease-seconds: 30


# 线程池配置
thread:
  pool:
    executor:
      config:
        core-pool-size: 20
        max-pool-size: 50
        keep-alive-time: 5000
        block-queue-size: 5000
        policy: CallerRunsPolicy

spring:
  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: guest
    password: guest
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: auto
        default-requeue-rejected: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:13306/hex_workspace?useUnicode=true&characterEncoding=utf8&autoReconnect=true&zeroDateTimeBehavior=convertToNull&serverTimezone=Asia/Shanghai&useSSL=true
    username: root
    password: 123456
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: Retail_HikariCP
      minimum-idle: 15
      idle-timeout: 180000
      maximum-pool-size: 25
      auto-commit: true
      max-lifetime: 1800000
      connection-timeout: 30000
      connection-test-query: SELECT 1
mybatis:
  mapper-locations: classpath:/mybatis/mapper/mysql/*.xml
  config-location:  classpath:/mybatis/config/mybatis-config.xml

# Redis
redis:
  sdk:
    config:
      host: localhost
      port: 16379
      pool-size: 10
      min-idle-size: 5
      idle-timeout: 30000
      connect-timeout: 5000
      retry-attempts: 3
      retry-interval: 1000
      ping-interval: 60000
      keep-alive: true

# MinIO
minio:
  sdk:
    config:
      endpoint: http://127.0.0.1:19000
      access-key: admin
      secret-key: admin123456
      bucket: hex-workspace

# RAG MVP：模型密钥只从本机环境或私有配置注入，禁止提交真实密钥。
ai:
  embedding:
    dashscope:
      api-key: ${DASHSCOPE_API_KEY:}
      model: text-embedding-v4
      dimensions: 1024
  vector-store:
    qdrant:
      endpoint: http://127.0.0.1:6333
      collection: hex_workspace_segments
  chat:
    openai:
      api-key: ${OPENAI_API_KEY:}
      base-url: ${OPENAI_BASE_URL:https://api.openai.com/v1}
      model: gpt-5.4

# 日志
logging:
  level:
    root: info
  config: classpath:logback-spring.xml
