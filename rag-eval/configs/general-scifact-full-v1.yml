dataset:
  version: general-scifact-full-v1
  suite: general
  source: scifact-beir-full-test
  split: test
  corpusCoverage: full
  queryCoverage: all-positive-qrels-test-queries
  comparableToBeirLeaderboard: false

ingestion:
  transport: public-document-import
  completion: document-active-plus-active-generation-ready
  source: frozen-public-corpus
  recommendedUploadBatchSize: 25

retrieval:
  transport: internal-evaluation-retrieval-v1
  implementation: IKnowledgeRetrievalService
  vectorStore: qdrant-candidate-recall
  authority: mysql-workspace-document-folder-active-generation-validation
  candidateLimit: 30
  finalTopK: 5

metrics:
  hitRate: true
  recall: true
  mrr: true
  latencyPercentiles: [50, 95, 99]

security:
  ingestion: frontend-jwt
  evaluation: hexworkspace.rag-evaluation.token
